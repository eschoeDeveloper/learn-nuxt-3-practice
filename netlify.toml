[build]
  command = "CI= npm run build"
  publish = ".output/public"  # Nuxt 3의 정적 파일 디렉토리
  functions = ".output/server"  # Nuxt API가 변환될 서버리스 함수 디렉토리

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "/.netlify/functions/server"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200