[[redirects]]
  from = "/api/*"
  to = "https://eschoedeveloper.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "https://eschoedeveloper.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false